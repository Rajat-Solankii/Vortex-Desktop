name: Desktop builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: vortex-windows-x64
          - runner: ubuntu-24.04
            artifact: vortex-linux-x64
          - runner: macos-15
            artifact: vortex-macos-arm64
          - runner: macos-15-intel
            artifact: vortex-macos-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb xauth
      - name: Select stable Rust
        run: rustup default stable
      - name: Test, build, and package
        shell: bash
        env:
          VORTEX_CATALOG_API_URL: ${{ github.event.repository.private && secrets.VORTEX_CATALOG_API_URL || 'https://example.invalid/api/tmdb' }}
        run: bash scripts/build-desktop.sh
      - name: Check Linux GUI startup
        if: runner.os == 'Linux'
        run: |
          status=0
          timeout 10s xvfb-run -a target/release/vortex-desktop || status=$?
          test "$status" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/packages/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
