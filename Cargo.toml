[package]
name = "vortex-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
wry = { version = "0.57.3", default-features = false, features = ["os-webview", "x11"] }
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
webkit2gtk-sys = { version = "2.0", features = ["v2_24"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "objc2-quartz-core"] }
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKContentRuleList", "WKContentRuleListStore", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
